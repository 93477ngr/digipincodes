name: Refresh LGD village/PIN index
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 1 */2 *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Build national index
        env:
          DATA_GOV_KEY: ${{ secrets.DATA_GOV_KEY }}
        run: python scripts/build_directory.py
      - name: Commit generated directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/data
          git diff --cached --quiet || git commit -m "chore(data): refresh LGD village PIN index"
          git push
